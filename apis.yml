aid: mezo
name: Mezo
description: >-
  Mezo is Bitcoin's economic layer — a Cosmos SDK-based appchain with full EVM
  compatibility, built by Thesis (creators of tBTC, Fold, and Taho). It lets
  Bitcoiners borrow, lend, spend, save, and earn yield without selling their
  BTC: BTC is used natively for gas, tBTC provides reliable bridging, and MUSD
  is a Bitcoin-backed stablecoin pegged 1:1 to the U.S. dollar. The chain runs
  the mezod reference client (forked from Evmos) on CometBFT consensus with a
  dual-staking model, and exposes Ethereum JSON-RPC, Cosmos REST/gRPC + CometBFT
  RPC, and a Blockscout explorer API. Developers deploy Solidity contracts with
  Hardhat or Foundry against mainnet EVM chain ID 31612 and testnet 31611, and
  can accept MUSD payments over the x402 (HTTP 402) protocol.
